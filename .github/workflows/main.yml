name: Docker Build & Push

on:
  push:
    branches: [master]
    tags: ["v*"]

jobs:
  build-and-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest

    steps:
      # 1. checkout
      - name: Checkout Sources
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. setup docker buildx
      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. cache docker layers
      - name: Cache Docker Layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: ${{ runner.os }}-buildx-${{ github.sha }}
          restore-keys: ${{ runner.os }}-buildx-

      # 4. setup node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: package-lock.json

      # 5. install npm dependencies
      - name: Install Dependencies
        run: npm ci

      # 6. build webpack assets
      - name: Build Assets
        run: node ./node_modules/webpack/bin/webpack.js --mode production --progress --config webpack.config.js

      # 8. login to docker hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 8. extract docker metadata (automatic versioning)
      - name: Extract Docker Metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME }}/${{ secrets.DOCKERHUB_PROJECT_NAME }}
          tags: |
            # On master push: tag as "latest" and "sha-<short>"
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-,enable={{is_default_branch}}

            # On tag push (vX.Y.Z): tag as "X.Y.Z", "X.Y", "X"
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}

      # 9. build and push docker image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max

      # 10. Move cache (prevents cache from growing unbounded)
      - name: Move Cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache
